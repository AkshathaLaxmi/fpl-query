  # --- ordering differences across sources --------------------------------
  "Heung-min Son": "Heung-Min Son"
  "Son Heung-min": "Heung-Min Son"
  "Min-jae Kim": "Min-Jae Kim"

  # --- transliteration and diacritic variants -----------------------------
  "Manuel Ugarte": "Manuel Ugarte Ribeiro"
  "Kaoru Mitoma": "Kaoru Mitoma"
  "Wataru Endo": "Wataru Endo"

# Names deliberately left unresolved, with a reason. The loader treats these as
# expected gaps rather than issues, so the open-issue count stays meaningful.
ignore:
  - value: "Unknown"
    reason: "placeholder rows in some archive seasons"
