[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpl-query"
version = "0.1.0"
description = "Natural-language query service over Premier League and Fantasy Premier League data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshatha Laxmi" }]
keywords = ["fpl", "premier-league", "text-to-sql", "bedrock", "rag"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
fplq = "fplq.cli:main"

[project.urls]
Repository = "https://github.com/akshathalaxmi/fpl-query"

[tool.hatch.build.targets.wheel]
packages = ["src/fplq"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# This module exists to fold lookalike characters, so flagging them as
# ambiguous is the rule misfiring on the one file where they are the subject.
"src/fplq/resolve/names.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: hits an external source; deselect with -m 'not network'",
    "database: needs a live Postgres; deselect with -m 'not database'",
]
